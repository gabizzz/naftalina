<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naftas cerca tuyo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--acc:#34d399;--acc2:#059669;--warn:#fbbf24;--err:#fb7185}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000;padding:.75rem 1rem}
.wrap{max-width:56rem;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between}
h1{font-size:1.25rem;margin:0}h1 span{color:var(--acc)}
.ctl{display:flex;gap:.5rem;flex-wrap:wrap}
label.sr{position:absolute;left:-9999px}
input,button{font:inherit;font-size:.85rem;border-radius:.5rem;border:1px solid var(--line);padding:.45rem .7rem;background:#334155;color:var(--txt)}
button{cursor:pointer;background:var(--acc2);border-color:var(--acc2);font-weight:600}
button:hover{background:#047857}
button.ghost{background:#334155;border-color:var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:56rem;margin:0 auto;padding:1rem;display:grid;gap:1rem}
#status{background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.75rem 1rem;font-size:.9rem;color:var(--mut)}
#status.error{color:var(--err);border-color:var(--err)}#status.warn{color:var(--warn);border-color:var(--warn)}#status.ok{color:var(--acc)}
#map{height:220px;border-radius:.75rem;border:1px solid var(--line)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{background:var(--panel);border-color:var(--line);color:var(--mut)}
.tabs button[aria-pressed=true]{background:var(--acc2);border-color:var(--acc2);color:#fff}
.list{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:.75rem;padding:.7rem 1rem;align-items:center}
.row.best{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.co{font-weight:700}.sub{font-size:.78rem;color:var(--mut)}
.pr{font-size:1.2rem;font-weight:800;color:var(--acc);text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;border-radius:.4rem;padding:.05rem .4rem;margin-left:.4rem;background:#334155;color:var(--txt);font-weight:600}
.tag.best{background:var(--acc2)}.diff{font-size:.75rem;color:var(--mut);text-align:right}
.near{color:var(--warn)}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:1rem}
footer a{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <h1>Naftas en <span id="city">…</span></h1>
  <form class="ctl" id="form" autocomplete="off">
    <label class="sr" for="q">Ciudad</label>
    <input id="q" list="cities" placeholder="Buscar ciudad" size="16">
    <datalist id="cities"></datalist>
    <button type="submit">Buscar</button>
    <button type="button" class="ghost" id="gps">Usar mi ubicación</button>
  </form>
</div></header>

<main>
  <div id="status" role="status" aria-live="polite">Cargando…</div>
  <div id="map" aria-label="Mapa"></div>
  <div class="tabs" id="tabs" role="group" aria-label="Tipo de combustible"></div>
  <ul class="list" id="list"></ul>
</main>

<footer>Datos de <a href="https://www.naftas.com.ar/api-docs" target="_blank" rel="noopener">naftas.com.ar</a> (Ministerio de Energía). Se actualizan cada varias horas y pueden tener demora.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ---------- Configuración ---------- */
const API = "https://naftas.com.ar/api/fuel";
// Se prueba directo primero; si el navegador lo bloquea por CORS, se usan estos en orden.
// Idealmente reemplazá alguno por tu propio Cloudflare Worker.
const PROXIES = [
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
const DEFAULT_CITY = "SAN PEDRO";
// URL de tu Cloudflare Worker (ej: "https://naftas.tuusuario.workers.dev/"). Si se completa, se usa primero.
const WORKER = "";
const TTL = 30 * 60 * 1000;

// La API no ofrece listado de ciudades: esta lista sirve para el buscador y para elegir la más cercana por GPS.
const CITIES = {
"CAPITAL FEDERAL":[-34.6037,-58.3816],"LA PLATA":[-34.9215,-57.9545],"MAR DEL PLATA":[-38.0055,-57.5426],
"BAHÍA BLANCA":[-38.7196,-62.2724],"CÓRDOBA":[-31.4201,-64.1888],"ROSARIO":[-32.9468,-60.6393],
"SANTA FE":[-31.6333,-60.7],"PARANÁ":[-31.7319,-60.5238],"MENDOZA":[-32.8895,-68.8458],"SAN JUAN":[-31.5375,-68.5364],
"SAN LUIS":[-33.295,-66.3356],"SAN MIGUEL DE TUCUMÁN":[-26.8083,-65.2176],"SALTA":[-24.7821,-65.4232],
"SAN SALVADOR DE JUJUY":[-24.1858,-65.2995],"SANTIAGO DEL ESTERO":[-27.7951,-64.2615],"CORRIENTES":[-27.4692,-58.8306],
"RESISTENCIA":[-27.4511,-58.9867],"POSADAS":[-27.3671,-55.8961],"FORMOSA":[-26.1775,-58.1781],"NEUQUÉN":[-38.9516,-68.0591],
"VIEDMA":[-40.8135,-62.9967],"RÍO GALLEGOS":[-51.6226,-69.2181],"USHUAIA":[-54.8019,-68.303],"RAWSON":[-43.3002,-65.1023],
"COMODORO RIVADAVIA":[-45.8641,-67.4966],"CATAMARCA":[-28.4696,-65.7795],"LA RIOJA":[-29.4131,-66.8558],
"SANTA ROSA":[-36.6203,-64.2906],"RÍO CUARTO":[-33.1307,-64.3499],"VILLA MARÍA":[-32.4074,-63.2409],
"SAN PEDRO":[-33.6784,-59.6641],"ZÁRATE":[-34.0981,-59.0286],"CAMPANA":[-34.1645,-58.9592],"PILAR":[-34.4587,-58.9142],
"MERLO":[-34.6654,-58.7276],"MORÓN":[-34.6534,-58.6198],"QUILMES":[-34.7206,-58.2546],"LOMAS DE ZAMORA":[-34.7609,-58.4017],
"SAN ISIDRO":[-34.4708,-58.5286],"TIGRE":[-34.4260,-58.5796],"SAN NICOLÁS":[-33.3345,-60.2211],"PERGAMINO":[-33.8895,-60.5736],
"JUNÍN":[-34.5847,-60.9583],"OLAVARRÍA":[-36.8927,-60.3225],"TANDIL":[-37.3217,-59.1332],"LUJÁN":[-34.5703,-59.105],
"SAN ANTONIO DE ARECO":[-34.2500,-59.4667],"BARADERO":[-33.8090,-59.5040],"RAMALLO":[-33.4870,-60.0060]
};

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
const money = new Intl.NumberFormat("es-AR", {style:"currency", currency:"ARS", maximumFractionDigits:0});
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleDateString("es-AR"); };
function h(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }
function setStatus(msg, kind){ const s = $("status"); s.textContent = msg; s.className = kind || ""; }
function km(a, b){
  const r = x => x * Math.PI / 180, dLat = r(b[0]-a[0]), dLng = r(b[1]-a[1]);
  const q = Math.sin(dLat/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;
  return 12742 * Math.asin(Math.sqrt(q));
}
function nearestCity(pos){
  let best = null, bd = Infinity;
  for (const [name, c] of Object.entries(CITIES)) { const d = km(pos, c); if (d < bd) { bd = d; best = name; } }
  return {name: best, dist: bd};
}
const CATS = ["Súper", "Premium", "Diésel", "Diésel premium", "GNC"];
function categoria(name){
  const n = norm(name);
  if (/GNC/.test(n)) return "GNC";
  if (/DIESEL|GASOIL|GAS OIL|EURO|D500/.test(n))
    return /\b(INFINIA|V-?POWER|QUANTIUM|ION|ULTRA|MAX)\b/.test(n) ? "Diésel premium" : "Diésel";
  if (/PREMIUM|INFINIA|V-?POWER|QUANTIUM|\bMAX\b|ULTRA|XXI/.test(n)) return "Premium";
  return "Súper";
}

/* ---------- Mapa ---------- */
let map, markers = [];
function showMap(user, cityName, coord){
  if (typeof L === "undefined") { $("map").hidden = true; return; }
  const c = coord || CITIES[cityName], pts = [];
  if (!map) {
    map = L.map("map").setView(c || [-34.6, -58.4], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);
  }
  markers.forEach(m => map.removeLayer(m)); markers = [];
  if (c) { markers.push(L.marker(c).addTo(map).bindPopup(cityName)); pts.push(c); }
  if (user) { markers.push(L.circleMarker(user, {radius:8, color:"#34d399", fillOpacity:.8}).addTo(map).bindPopup("Estás acá")); pts.push(user); }
  if (pts.length > 1) map.fitBounds(pts, {padding:[30,30], maxZoom:13});
  else if (pts.length) map.setView(pts[0], 12);
}

/* ---------- Datos ---------- */
let reqId = 0, lastUser = null;
async function tryFetch(url){
  const r = await fetch(url, {signal: AbortSignal.timeout(9000)});
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  if (!j || typeof j !== "object" || j.error) throw new Error("Respuesta inválida");
  return j;
}
const errores = [];
async function pedir(city){
  const url = API + "?city=" + encodeURIComponent(city);
  const rutas = [];
  if (WORKER) rutas.push(["worker", WORKER + "?city=" + encodeURIComponent(city)]);
  rutas.push(["directo", url], ...PROXIES.map((p, i) => ["proxy " + (i + 1), p(url)]));
  // En paralelo: gana la primera que responde bien.
  return Promise.any(rutas.map(([nombre, u]) =>
    tryFetch(u).catch(e => { errores.push(city + " / " + nombre + ": " + e.message); throw e; })
  ));
}
function extraer(data, city){
  const key = Object.keys(data).find(k => norm(k) === norm(city));
  return key ? data[key] : null;
}
const readCache = k => { try { return JSON.parse(localStorage.getItem("naftas:" + k)); } catch { return null; } };
const writeCache = (k, v) => { try { localStorage.setItem("naftas:" + k, JSON.stringify({t: Date.now(), v})); } catch {} };

async function cargar(city, opts = {}){
  const id = ++reqId, k = norm(city);
  $("city").textContent = city;
  try { localStorage.setItem("naftas:last", city); } catch {}
  showMap(opts.user, city);

  const c = readCache(k);
  if (c && Date.now() - c.t < TTL) { render(c.v, city, opts.aviso); return; }

  setStatus("Consultando precios de " + city + "…");
  try {
    let data = null, info = null, lastErr;
    errores.length = 0;
    // Se prueba sin tilde primero (como en la versión original) y después con tilde.
    for (const v of new Set([norm(city), city])) {
      try {
        data = await pedir(v);
        info = extraer(data, city);
        if (info && info.empresas && Object.keys(info.empresas).length) break;
      } catch (e) { lastErr = e; }
    }
    if (id !== reqId) return;
    if (!data) throw lastErr;
    if (!info || !info.empresas || !Object.keys(info.empresas).length) {
      const otras = Object.keys(data).filter(Boolean);
      setStatus("No hay precios registrados para " + city + "." + (otras.length ? " La API devolvió: " + otras.join(", ") + "." : " Probá con otra ciudad cercana."), "error");
      $("list").replaceChildren(); $("tabs").replaceChildren();
      return;
    }
    writeCache(k, info);
    render(info, city, opts.aviso);
  } catch (e) {
    if (id !== reqId) return;
    if (c) { render(c.v, city, "No se pudo actualizar; mostrando datos guardados del " + new Date(c.t).toLocaleString("es-AR") + "."); return; }
    console.error("Fallos al consultar " + city + ":\n" + errores.join("\n"));
    setStatus("No se pudieron cargar los precios de " + city + ". Detalle: " + (errores.length ? [...new Set(errores)].join(" | ") : "sin respuesta") + ".", "error");
    $("list").replaceChildren(); $("tabs").replaceChildren();
  }
}

/* ---------- Render ---------- */
let current = null, cat = null;
function render(info, city, aviso){
  const items = [];
  for (const [empresa, fuels] of Object.entries(info.empresas || {})) {
    if (!fuels || typeof fuels !== "object") continue;
    for (const [fuel, d] of Object.entries(fuels)) {
      const precio = Number(d && d.precio);
      if (!isFinite(precio) || precio <= 0) continue;
      items.push({empresa, fuel, precio, fecha: d.fecha_vigencia, horario: d.horario, near: d.fromNearby, nearKm: d.fromNearbyDistanceKm, cat: categoria(fuel)});
    }
  }
  current = items;
  const disponibles = CATS.filter(c => items.some(i => i.cat === c));
  if (!items.length) { setStatus("Sin precios válidos para " + city + ".", "error"); return; }
  if (!cat || !disponibles.includes(cat)) cat = disponibles[0];
  setStatus(aviso || "Precios de " + city + " actualizados.", aviso ? "warn" : "ok");

  const tabs = $("tabs"); tabs.replaceChildren();
  disponibles.forEach(c => {
    const b = h("button", "", c + " (" + items.filter(i => i.cat === c).length + ")");
    b.type = "button"; b.setAttribute("aria-pressed", String(c === cat));
    b.onclick = () => { cat = c; render(info, city, aviso); };
    tabs.appendChild(b);
  });

  const rows = items.filter(i => i.cat === cat).sort((a, b) => a.precio - b.precio);
  const min = rows[0].precio, list = $("list"); list.replaceChildren();
  rows.forEach((r, idx) => {
    const li = h("li", "row" + (idx === 0 ? " best" : ""));
    const left = h("div"), name = h("div", "co", r.empresa);
    if (idx === 0) name.appendChild(h("span", "tag best", "Más barata"));
    if (r.horario) name.appendChild(h("span", "tag", r.horario === "noche" ? "Noche 22–06 h" : r.horario === "dia" ? "Día 06–22 h" : r.horario));
    left.appendChild(name);
    const sub = [r.fuel, r.fecha ? "vigente desde " + fmtDate(r.fecha) : ""].filter(Boolean).join(" · ");
    left.appendChild(h("div", "sub", sub));
    if (r.near) left.appendChild(h("div", "sub near", "Precio de estación cercana: " + r.near + (r.nearKm != null ? " (" + r.nearKm + " km)" : "")));
    const right = h("div");
    right.appendChild(h("div", "pr", money.format(r.precio)));
    right.appendChild(h("div", "diff", idx === 0 ? "por litro" : "+" + money.format(r.precio - min)));
    li.append(left, right); list.appendChild(li);
  });
}

/* ---------- Ubicación e interfaz ---------- */
function usarGPS(){
  if (!("geolocation" in navigator)) { cargar(DEFAULT_CITY, {aviso: "Tu navegador no ofrece ubicación. Mostrando " + DEFAULT_CITY + "."}); return; }
  setStatus("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(pos => {
    const u = [pos.coords.latitude, pos.coords.longitude], n = nearestCity(u);
    const aviso = n.dist > 15 ? "Tu ciudad no está en la lista; mostrando la más cercana: " + n.name + " (a " + Math.round(n.dist) + " km)." : null;
    cargar(n.name, {user: u, aviso});
  }, () => {
    cargar(DEFAULT_CITY, {aviso: "No pudimos obtener tu ubicación. Mostrando " + DEFAULT_CITY + "; buscá tu ciudad arriba."});
  }, {timeout: 10000, maximumAge: 60000});
}

$("cities").replaceChildren(...Object.keys(CITIES).map(n => { const o = document.createElement("option"); o.value = n; return o; }));
$("gps").onclick = usarGPS;
$("form").onsubmit = e => {
  e.preventDefault();
  const v = $("q").value.trim(); if (!v) return;
  const match = Object.keys(CITIES).find(k => norm(k) === norm(v));
  cargar(match || v.toUpperCase());
};

let ultima = null; try { ultima = localStorage.getItem("naftas:last"); } catch {}
if (ultima) cargar(ultima); else usarGPS();
</script>
</body>
</html>
