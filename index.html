<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precios de Combustible - Geocercanía</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        #map { height: 250px; width: 100%; border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 shadow-md p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gas-pump text-emerald-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Naftas <span id="cityNameHeader" class="text-emerald-400 uppercase">Detectando...</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <select id="manualCity" onchange="cambiarCiudadManual(this.value)" class="bg-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 border border-slate-600 focus:outline-none">
                    <option value="" disabled selected>Forzar ciudad...</option>
                    <option value="SAN PEDRO">San Pedro</option>
                    <option value="ZARATE">Zárate</option>
                    <option value="CAMPANA">Campana</option>
                    <option value="PILAR">Pilar</option>
                </select>
                <button onclick="detectarUbicacionYCargar()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs transition flex items-center gap-1 cursor-pointer shadow">
                    <i class="fa-solid fa-crosshairs"></i> GPS
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-6">
        
        <!-- Estado / Alertas -->
        <div id="status" class="bg-slate-800 border border-slate-700 p-4 rounded-xl text-sm flex items-center gap-3 text-slate-300">
            <i class="fa-solid fa-spinner fa-spin text-emerald-400 text-lg"></i>
            <span>Obteniendo ubicación y consultando precios...</span>
        </div>

        <!-- Mapa -->
        <div class="bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-lg">
            <div id="map"></div>
        </div>

        <!-- Listado de Estaciones / Marcas -->
        <section>
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-slate-200">
                <i class="fa-solid fa-list-ul text-emerald-400"></i> Precios por Estación / Empresa
            </h2>
            <div id="stations-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-400">
        Datos de <a href="https://www.naftas.com.ar" target="_blank" class="text-emerald-400 hover:underline">naftas.com.ar</a> • GitHub Pages Ready
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        let userMarker = null;

        function initMap(lat = -33.681, lng = -59.667) {
            if (!map) {
                map = L.map('map').setView([lat, lng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(map);
            } else {
                map.setView([lat, lng], 13);
            }
        }

        function actualizarEstado(mensaje, tipo = 'info', spinner = true) {
            const statusDiv = document.getElementById('status');
            let iconClass = spinner ? 'fa-solid fa-spinner fa-spin text-emerald-400 text-lg' : 'fa-solid fa-circle-info text-emerald-400 text-lg';
            if (tipo === 'error') iconClass = 'fa-solid fa-triangle-exclamation text-rose-400 text-lg';
            if (tipo === 'success') iconClass = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            statusDiv.innerHTML = `<i class="${iconClass}"></i><span>${mensaje}</span>`;
        }

        async function detectarUbicacionYCargar() {
            initMap();
            actualizarEstado("Leyendo GPS del dispositivo...", "info", true);

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        
                        if (userMarker) map.removeLayer(userMarker);
                        userMarker = L.marker([lat, lng]).addTo(map).bindPopup("<b>Estás aquí</b>");
                        map.setView([lat, lng], 13);

                        const cityName = await obtenerCiudadPorCoordenadas(lat, lng);
                        document.getElementById('cityNameHeader').innerText = cityName;
                        fetchPreciosCiudad(cityName);
                    },
                    (error) => {
                        console.warn("GPS denegado. Usando San Pedro por defecto.");
                        fetchPreciosCiudad("SAN PEDRO");
                    },
                    { timeout: 10000, maximumAge: 60000 }
                );
            } else {
                fetchPreciosCiudad("SAN PEDRO");
            }
        }

        async function obtenerCiudadPorCoordenadas(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`, {
                    headers: { 'Accept-Language': 'es' }
                });
                const data = await response.json();
                const address = data.address || {};
                const ciudad = address.city || address.town || address.village || address.municipality || "SAN PEDRO";
                return ciudad.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
            } catch (e) {
                return "SAN PEDRO";
            }
        }

        function cambiarCiudadManual(ciudad) {
            document.getElementById('cityNameHeader').innerText = ciudad;
            fetchPreciosCiudad(ciudad);
        }

                async function fetchPreciosCiudad(city) {
            actualizarEstado(`Consultando precios para ${city}...`, "info", true);
            try {
                // Normalizamos a minúsculas y reemplazamos espacios por guiones (ej: "SAN PEDRO" -> "san-pedro")
                const citySlug = city.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().replace(/\s+/g, '-');
                
                const targetUrl = `https://www.naftas.com.ar/api/fuel?city=${citySlug}`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("Error al conectar con la API");
                
                const data = await response.json();
                procesarDatosAPI(data, city);
            } catch (error) {
                console.error(error);
                actualizarEstado(`Error al obtener los datos para ${city}.`, "error", false);
            }
        }


        function procesarDatosAPI(data, cityRequested) {
            const listContainer = document.getElementById('stations-list');
            listContainer.innerHTML = '';

            // Si la API devuelve un objeto plano con la ciudad como llave principal
            const llaves = Object.keys(data);
            if (llaves.length === 0) {
                actualizarEstado(`No se encontraron registros para ${cityRequested}.`, "error", false);
                return;
            }

            const cityKey = llaves.includes(cityRequested) ? cityRequested : llaves[0];
            const infoCiudad = data[cityKey];
            document.getElementById('cityNameHeader').innerText = cityKey;

            if (!infoCiudad || !infoCiudad.empresas) {
                actualizarEstado(`Estructura de datos inválida para ${cityKey}.`, "error", false);
                return;
            }

            const empresas = infoCiudad.empresas;
            let contador = 1;

            Object.keys(empresas).forEach(nombreEmpresa => {
                const combustibles = empresas[nombreEmpresa];
                
                let combustiblesHTML = '';
                Object.keys(combustibles).forEach(combustibleNombre => {
                    const det = combustibles[combustibleNombre];
                    combustiblesHTML += `
                        <div class="bg-slate-700/50 p-2 rounded-lg flex justify-between items-center text-xs">
                            <span class="text-slate-300 font-medium">${combustibleNombre}</span>
                            <div class="text-right">
                                <span class="text-emerald-400 font-bold block">$${det.precio}</span>
                                ${det.fromNearby ? `<span class="text-[10px] text-amber-400/80" title="Cercano desde ${det.fromNearby}">📍 ${det.fromNearby} (${det.fromNearbyDistanceKm}km)</span>` : ''}
                            </div>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 hover:border-slate-600 rounded-xl p-4 shadow flex flex-col justify-between gap-3 transition";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">#${contador++} • Empresa</span>
                            <span class="text-[10px] bg-slate-700 px-2 py-0.5 rounded text-slate-300">${infoCiudad.horario || 'Estándar'}</span>
                        </div>
                        <h3 class="font-bold text-base text-white mt-1 flex items-center gap-2">
                            <i class="fa-solid fa-gas-pump text-slate-400"></i> ${nombreEmpresa}
                        </h3>
                    </div>
                    <div class="flex flex-col gap-1.5 mt-2">
                        <span class="text-xs font-semibold text-slate-400">Combustibles y Precios:</span>
                        <div class="grid grid-cols-1 gap-1.5">
                            ${combustiblesHTML}
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            actualizarEstado(`Datos cargados correctamente para ${cityKey}.`, "success", false);
        }

        window.onload = () => {
            detectarUbicacionYCargar();
        };
    </script>
</body>
</html>
